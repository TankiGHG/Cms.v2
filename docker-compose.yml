services:
  app:
    build: .
    container_name: cms-v2
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    volumes:
      # Persistent data (SQLite DB, sessions, uploads). Must be writable by
      # uid 1000 (the container's "node" user): chown -R 1000:1000 ./data
      - ./data:/app/data
      # Optional: live-edit the frontend without rebuilds (read-only).
      - ./public:/app/public:ro
    environment:
      - NODE_ENV=production
