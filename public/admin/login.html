<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>CMS – Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background: #0a0a0a; color: #eee; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .box {
            background: #141414; border: 1px solid #2a2a2a; border-radius: 14px;
            padding: 32px; width: 100%; max-width: 380px;
        }
        h1 { font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; text-align: center; }
        label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: #999; margin-bottom: 6px; font-weight: 600; }
        input {
            width: 100%; background: #0e0e0e; border: 1px solid #2a2a2a; padding: 12px;
            border-radius: 8px; color: #fff; font-size: 0.95rem; margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: #ff3366; }
        button {
            width: 100%; background: transparent; color: #fff; border: 2px solid #ff3366;
            padding: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
            transition: background 0.2s;
        }
        button:hover { background: #ff3366; }
        .feedback { margin-top: 14px; font-weight: 600; font-size: 0.85rem; min-height: 1.2em; color: #e5484d; text-align: center; }
        .back { display: block; text-align: center; margin-top: 18px; color: #666; font-size: 0.8rem; text-decoration: none; }
        .back:hover { color: #ff3366; }
    </style>
</head>
<body>
    <div class="box">
        <h1>CMS Admin</h1>
        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
            <div class="feedback" id="login-feedback"></div>
        </form>
        <a class="back" href="/">← Back to site</a>
    </div>
    <script src="/admin/login.js"></script>
</body>
</html>
